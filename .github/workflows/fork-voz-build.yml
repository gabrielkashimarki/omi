# Fork: compila o app de Mac. Gera o executável "Omi Computer" (release) para trocar dentro de uma
# cópia do Omi.app. O chat do Omi e o processo Node do agente saíram do app, então não há agent/dist.
name: Fork voz build
on:
  workflow_dispatch:
  push:
    branches: [voz-cerebro-claude]
    paths: ["desktop/macos/**", ".github/workflows/fork-voz-build.yml"]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/macos
      - name: Xcode
        run: |
          sudo xcode-select -s "$(jq -r .app_path desktop/macos/ci/xcode-pin.json)"
          swift --version
      - name: Swift (release)
        run: xcrun swift build -c release --package-path desktop/macos/Desktop -Xswiftc -emit-const-values
      - name: Empacotar
        run: |
          mkdir -p saida
          bin="$(xcrun swift build -c release --package-path desktop/macos/Desktop --show-bin-path)"
          cp "$bin/Omi Computer" saida/
          # o swift build linka o libwebp do Homebrew e não põe Frameworks no rpath; o Omi.app já traz os dois
          webp="$(otool -L "saida/Omi Computer" | awk '/libwebp\.7\.dylib/{print $1; exit}')"
          install_name_tool -change "$webp" @rpath/libwebp.7.dylib -add_rpath @executable_path/../Frameworks "saida/Omi Computer"
          shasum -a 256 saida/* > saida/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: omi-fork-voz
          path: saida
          retention-days: 14
